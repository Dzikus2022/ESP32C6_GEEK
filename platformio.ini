; ESP32-C6-GEEK (Waveshare) — pierwszy test: tylko USB Serial.
; Definicja płytki: kompatybilny ESP32-C6 DevKitC-1 (QFN40).
; Pinout GEEK (LCD, przyciski, czujniki) NIE jest tu mapowany.

; Oficjalne platform = espressif32 zostaje przy Arduino 2.x i nie obsługuje
; ESP32-C6 + framework = arduino. Potrzebne jest Arduino 3.x (pioarduino).
; 55.03.312 wymaga PlatformIO Core >= 6.2.0; lokalne Core to 6.1.19,
; więc pin to 54.03.20 (Arduino 3.2, kompatybilne z 6.1.19).
[env:esp32-c6-geek]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Fizyczna pamięć: 16 MB (potwierdzone). Nie kasujemy całego flasha.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Native USB-Serial/JTAG — Serial.println() idzie po USB CDC.
; To nie są przypisania GPIO peryferiów.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
