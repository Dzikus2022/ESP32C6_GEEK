; ESP32-C6-GEEK (Waveshare) — GEEK Radar v0.1
; Definicja płytki: kompatybilny ESP32-C6 DevKitC-1 (QFN40).
; LCD/BOOT: oficjalne demo Waveshare V1 i V2 (ten sam LCD). TF/SD nieużywane.

; Oficjalne platform = espressif32 zostaje przy Arduino 2.x i nie obsługuje
; ESP32-C6 + framework = arduino. Potrzebne jest Arduino 3.x (pioarduino).
; 55.03.312 wymaga PlatformIO Core >= 6.2.0; lokalne Core to 6.1.19,
; więc pin to 54.03.20 (Arduino 3.2, kompatybilne z 6.1.19).
[env:esp32-c6-geek]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Fizyczna pamięć: 16 MB (potwierdzone). Nie kasujemy całego flasha.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Native USB-Serial/JTAG — Serial.println() idzie po USB CDC.
; To nie są przypisania GPIO peryferiów.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Adafruit_GFX + ST7789: rysowanie bez pełnego framebuffera.
; NimBLE-Arduino: skan reklam BLE na C6 bez ciężkiego Bluedroid.
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    h2zero/NimBLE-Arduino@^2.2.3

; ST7789 ciągnie opcjonalne SD/seesaw — nie używamy TF (konflikt V1/V2).
lib_ignore =
    SD
    Adafruit seesaw Library
